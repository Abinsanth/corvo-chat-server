[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Abinsanth/corvo-chat-server"

[workspace.dependencies]
corvo-chat-proto = { path = "crates/corvo-chat-proto" }
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
ed25519-dalek = "2.2.0"
futures = "0.3.34"
hkdf = "0.12.4"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
opaque-ke = { version = "4.0.1", features = ["argon2"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = "0.14.10"
rlimit = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "tls12", "webpki-roots"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# Smaller downloads for the release binaries.
[profile.release]
strip = true

# Debug builds and tests keep only line numbers (enough for panics and
# backtraces), and none for dependencies: a fraction of the disk space.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2 is very slow unoptimized, and one test per crate runs the real
# 64 MiB setting.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
