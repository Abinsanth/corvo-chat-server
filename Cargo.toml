[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Abinsanth/corvo-chat-server"

[workspace.dependencies]
corvo-chat-proto = { path = "crates/corvo-chat-proto" }
clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# Smaller downloads for the release binaries.
[profile.release]
strip = true

# Debug builds and tests keep only line numbers (enough for panics and
# backtraces), and none for dependencies: a fraction of the disk space.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
